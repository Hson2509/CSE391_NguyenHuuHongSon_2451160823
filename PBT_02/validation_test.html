<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form>
        <div>
            <label>1. Required :</label><br>
            <input type="text" required value="">
        </div>
        <br>

        <!-- Trường hợp 2 -->
        <div>
            <label>2. Email :</label><br>
            <input type="email" value="abc">
        </div>

        <br>

        <!-- Trường hợp 3 -->
        <div>
            <label>3. Number :</label><br>
            <input type="number" min="1" max="10" value="15">
        </div>

        <br>

        <!-- Trường hợp 4 -->
        <div>
            <label>4. Pattern :</label><br>
            <input type="text" pattern="[0-9]{10}" value="abc123">
        </div>

        <br>

        <!-- Trường hợp 5 -->
        <div>
            <label>5. Password :</label><br>
            <input type="password" minlength="8" value="123">
        </div>

        <br>
        <button type="submit">Submit</button>

    </form>
</body>

</html>
