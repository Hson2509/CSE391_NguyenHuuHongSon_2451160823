<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form action="#" method="post">
        <fieldset>
            <legend>Thông tin cá nhân</legend>
            <label for="fullname">Họ tên</label>
            <input type="text" id="fullname" name="fullname" placeholder="Họ tên" minlength="2" maxlength="50"><br><br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Email"><br><br>
            <label for="telephone">Số điện thoại:</label>
            <input type="tel" id="telephone" name="telephone" pattern="[0-9]{10}" placeholder="Số điện thoại"><br><br>
            <label for="date">Ngày sinh:</label>
            <input type="date" id="date" name="date" max="2026-04-30"><br><br>
        </fieldset>

        <fieldset>
            <legend>Tài khoản</legend>
            <label for="username">UserName:</label>
            <input type="text" id="username" name="username" placeholder="Tên đăng nhập" pattern="[a-zA-Z0-9_]{3,20}$"
                required><br><br>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Mật khẩu"
                pattern="(?=.*[A-Z])(?=.*\d).{8,}$" required><br><br>
            <label for="confirm_password">Xác nhận password:</label>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="Nhập lại mật khẩu"
                pattern="(?=.*[A-Z])(?=.*\d).{8,}$" required><br><br>
        </fieldset>

        <fieldset>
            <legend>Thông tin giao hàng</legend>
            <label for="city">Thành phố:</label>
            <select id="city" name="city" required>
                <option value="">Chọn thành phố</option>
                <option value="hue">Huế</option>
                <option value="hanoi">Hà Nội</option>
                <option value="hcm">Hồ Chí Minh</option>
                <option value="danang">Đà Nẵng</option>
                <option value="haiphong">Hải Phòng</option>
            </select><br><br>
            <label for="District">Quận/Huyện:</label>
            <select id="District" name="District" required>
                <option value="">Chọn quận/huyện</option>
                <option value="HaDong">Hà Đông</option>
                <option value="HaiBaTrung">Hai Bà Trưng</option>
                <option value="BaDinh">Ba Đình</option>
                <option value="HoanKiem">Hoàn Kiếm</option>
            </select><br><br>
            <label for="address">Địa chỉ chi tiết:</label>
            <textarea id="address" name="address" placeholder="Địa chỉ chi tiết" rows="3" required></textarea><br><br>
            <span>Giới tính:</span>
            <input type="radio" id="male" name="sex" value="male" required>
            <label for="male">Nam</label>
            <input type="radio" id="female" name="sex" value="female" required>
            <label for="female">Nữ</label>
            <input type="radio" id="other" name="sex" value="other" required>
            <label for="other">Khác</label>

        </fieldset>
        <input type="checkbox" id="terms" name="terms" required>
        <label for="terms">Tôi đồng ý với các điều khoản và điều kiện</label><br><br>
        <button type="submit" value="Đăng ký">Đăng ký</button>
        <button type="reset" value="Làm mới">Làm mới</button>
    </form>


</body>

</html>
