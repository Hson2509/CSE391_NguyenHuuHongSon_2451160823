<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh toán đơn hàng</title>
</head>

<body>

    <h2>Chi tiết đơn hàng</h2>

    <table style="width: 100%; border-collapse: collapse; text-align: center;">
        <thead>
            <tr style="background-color: #f2f2f2;">
                <th>STT</th>
                <th>Sản phẩm</th>
                <th>Đơn giá</th>
                <th>Số lượng</th>
                <th>Thành tiền</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>iPhone 16 Pro Max</td>
                <td>34.990.000đ</td>
                <td>1</td>
                <td>34.990.000đ</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Ốp lưng MagSafe</td>
                <td>1.500.000đ</td>
                <td>2</td>
                <td>3.000.000đ</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Củ sạc 20W</td>
                <td>500.000đ</td>
                <td>1</td>
                <td>500.000đ</td>
            </tr>
        </tbody>
        <tfoot>
            <tr style="font-weight: bold; background-color: #eee;">
                <td colspan="4">Tổng cộng</td>
                <td>38.490.000đ</td>
            </tr>
        </tfoot>
    </table>

    <hr>

    <form action="#" method="POST">
        <fieldset>
            <legend>Form thanh toán</legend>
            <p>
                <strong>Phương thức thanh toán:</strong><br>
                <input type="radio" id="cod" name="payment" value="cod" required>
                <label for="cod">COD</label><br>

                <input type="radio" id="bank" name="payment" value="bank">
                <label for="bank">Chuyển khoản ngân hàng</label><br>

                <input type="radio" id="wallet" name="payment" value="wallet">
                <label for="wallet">Ví điện tử</label>
            </p>

            <p>
                <label for="voucher">Mã giảm giá:</label><br>
                <input type="text" id="voucher" name="voucher" placeholder="VD: SALE2026" pattern="^SALE[0-9]{4}$"
                    title="Mã phải bắt đầu bằng SALE và kèm 4 chữ số (VD: SALE1234)">
            </p>

            <p>
                <label for="note">Ghi chú đơn hàng:</label><br>
                <textarea id="note" name="note" rows="4" cols="50"
                    placeholder="Yêu cầu đặc biệt về đơn hàng..."></textarea>
            </p>
        </fieldset>

        <fieldset>
            <legend>Thông tin giao hàng</legend>
            <p>
                <label for="delivery_date">Ngày giao hàng mong muốn:</label><br>
                <input type="date" id="delivery_date" name="delivery_date" min="2026-05-01" required>
            </p>

            <p>
                <label for="delivery_time">Khung giờ giao hàng:</label><br>
                <select id="delivery_time" name="delivery_time" required>
                    <option value="">-- Chọn khung giờ --</option>
                    <option value="morning">Sáng 8h - 12h</option>
                    <option value="afternoon">Chiều 14h - 18h</option>
                    <option value="evening">Tối 18h - 21h</option>
                </select>
            </p>

            <p>
                <label for="shipping_speed">Thời gian giao hàng dự kiến (1-7 ngày):</label><br>
                <span>Nhanh</span>
                <input type="range" id="shipping_speed" name="shipping_speed" min="1" max="7" step="1" value="3">
                <span>Tiết kiệm</span>
            </p>
        </fieldset>

        <br>
        <button type="submit" aria-label="Xác nhận đặt hàng">Xác nhận đặt hàng</button>
    </form>

</body>

</html>
