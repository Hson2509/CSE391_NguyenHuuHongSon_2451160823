<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="QLSV.css">
    <title>Document</title>
</head>

<body>
    <header>
        <div class="container-fluid">
            <h1>Quản lý sinh viên</h1>
            <nav>
                <ul>
                    <li><a href="#">Trang chủ</a></li>
                    <li><a href="#">Sinh viên</a></li>
                    <li><a href="#">Liên hệ</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <section class="start-section">
            <div class="d-flex container stat-container">
                <div class="stat-box total-students">
                    <span class="stat-label">Tổng số sinh viên:</span>
                    <span id="lbl-total-sv" class="stat-number stat-label"></span>
                </div>
                <div class="stat-box average-score d-flex">
                    <span class="stat-label">Điểm trung bình chung:</span>
                    <span id="lbl-average-score" class="stat-number stat-label"></span>
                </div>
            </div>
        </section>
        <section>
            <div class="container">
                <h2>Danh sách sinh viên</h2>
                <button class="add-btn btn-choose">Thêm sinh viên</button>
                <div>
                    <table id="info-student">
                        <thead>
                            <tr>
                                <th>Mã SV</th>
                                <th>Họ tên</th>
                                <th>Ngày sinh</th>
                                <th>Lớp học</th>
                                <th>Điểm trung bình</th>
                                <th>Email</th>
                                <th>Thao tác</th>
                            </tr>
                        </thead>
                        <tbody class="stu-list">

                        </tbody>
                    </table>
                </div>
            </div>
        </section>
        <div id="student-modal" class="form-overlay">
            <div class="model-box">
                <span class="close-btn" id="btn-close-modal">&times;</span>
                <h2>Thêm sinh viên mới </h2>
                <form id="add-student-form" novalidate>
                    <div class="form-group">
                        <label for="student-id">Mã SV:</label>
                        <input type="text" id="student-id" name="student-id" placeholder="VD:SV001">
                        <div class="error" id="error-student-id"></div>
                    </div>
                    <div class="form-group">
                        <label for="student-name">Họ tên:</label>
                        <input type="text" id="student-name" name="student-name">
                        <div class="error" id="error-student-name"></div>
                    </div>
                    <div class="form-group">
                        <label for="student-birthday">Ngày sinh:</label>
                        <input type="date" id="student-birthday" name="student-birthday">
                        <div class="error" id="error-student-birthday"></div>
                    </div>
                    <div class="form-group">
                        <label for="student-class">Lớp học:</label>
                        <input type="text" id="student-class" name="student-class" placeholder="K66">
                        <div class="error" id="error-student-class"></div>
                    </div>
                    <div class="form-group">
                        <label for="student-average">Điểm trung bình:</label>
                        <input type="number" id="student-average" name="student-average" step="0.1" min="0" max="10"
                            placeholder="VD:8.8">
                        <div class="error" id="error-student-average"></div>
                    </div>
                    <div class="form-group">
                        <label for="student-email">Email:</label>
                        <input type="email" id="student-email" name="student-email" placeholder="VD:abc@gmail.com">
                        <div class="error" id="error-student-email"></div>
                    </div>
                    <div class="btn">
                        <button type="submit" class="btn-submit">Thêm/Sửa sinh viên</button>
                        <button type="button" class="btn-cancel" id="btn-cancel">Hủy</button>
                    </div>
                </form>
            </div>
        </div>

    </main>
    <script src="index.js"></script>
</body>

</html>
